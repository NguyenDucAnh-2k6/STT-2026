# ====================================================================
# Eclipse Mosquitto MQTT Broker Configuration
# Edge AI Network Anomaly Detection System
# ====================================================================

# Standard MQTT Port for ESP32 and Backend
listener 1883 0.0.0.0

# WebSocket Port for Direct Web Browser Access (Optional)
listener 9001 0.0.0.0
protocol websockets

# Allow Anonymous Connections (For Local MVP & Prototyping)
allow_anonymous true

# Persistence Settings
persistence true
persistence_location ./broker/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
