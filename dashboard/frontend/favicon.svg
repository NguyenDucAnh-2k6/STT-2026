<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background circle -->
  <rect width="64" height="64" rx="14" fill="#0b1120" />
  <circle cx="32" cy="32" r="26" fill="url(#glowGrad)" />

  <!-- Outer shield border -->
  <path d="M32 8 L50 16 C50 36 32 48 32 54 C32 48 14 36 14 16 Z" 
        fill="#0f172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Inner tech pulse lines -->
  <path d="M32 16 L44 22 C44 36 32 44 32 48 C32 44 20 36 20 22 Z" 
        fill="none" 
        stroke="#06b6d4" 
        stroke-width="1.2" 
        stroke-dasharray="2 2"
        opacity="0.6" />

  <!-- Center AI Node / Checkmark -->
  <path d="M26 31 L30 35 L38 25" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Glowing pulse dot -->
  <circle cx="32" cy="18" r="2" fill="#06b6d4" />
</svg>
