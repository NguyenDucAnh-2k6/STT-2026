name: aero-twin-lab
services:
  http-target:
    image: python:3.12-slim
    command: ["python", "/lab/http_target.py", "--bind", "0.0.0.0", "--port", "8088"]
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:-8088}:8088"
    volumes:
      - ./http_target.py:/lab/http_target.py:ro
      - ./fixture_app.py:/lab/fixture_app.py:ro
    networks: [experiment]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
networks:
  experiment:
    internal: true
